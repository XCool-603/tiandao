services:
  tiandao:
    build:
      context: .
      dockerfile: Dockerfile
    image: xcool/tiandao:latest
    container_name: tiandao
    restart: unless-stopped
    ports:
      - "${TIANDAO_PORT:-8088}:8088"        # Web 控制台与 RESTful API (可自定义宿主机端口)
      - "${TIANDAO_WS_PORT:-8089}:8089"     # WebSocket 流式推演信道 (可自定义宿主机端口)
    env_file:
      - path: .env
        required: false
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_api_key_here}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      - MODEL_NAME=${MODEL_NAME:-deepseek-chat}
      - TIANDAO_MODEL=${TIANDAO_MODEL:-}
      - CHRONICLER_MODEL=${CHRONICLER_MODEL:-}
      - ADMIN_KEY=${ADMIN_KEY:-admin888}
      - TZ=Asia/Shanghai
    volumes:
      # 持久化挂载小说章节、大纲伏线总账与推演数据
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
