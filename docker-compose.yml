services:
  tiandao:
    build:
      context: .
      dockerfile: Dockerfile
    image: xcool/tiandao:latest
    container_name: tiandao
    restart: unless-stopped
    ports:
      - "${TIANDAO_HOST_PORT:-28088}:8088"        # Web 控制台与 RESTful API (宿主机端口 28088 -> 容器 8088)
      - "${TIANDAO_HOST_WS_PORT:-28089}:8089"     # WebSocket 流式推演信道 (宿主机端口 28089 -> 容器 8089)
    env_file:
      - path: output/.env
        required: false
      - path: .env
        required: false
    environment:
      - TIANDAO_PORT=8088
      - TIANDAO_WS_PORT=8089
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      - MODEL_NAME=${MODEL_NAME:-deepseek-chat}
      - TIANDAO_MODEL=${TIANDAO_MODEL:-}
      - CHRONICLER_MODEL=${CHRONICLER_MODEL:-}
      - DRAMA_MODEL=${DRAMA_MODEL:-}
      - DRAMA_API_KEY=${DRAMA_API_KEY:-}
      - DRAMA_BASE_URL=${DRAMA_BASE_URL:-}
      - ADMIN_KEY=${ADMIN_KEY:-admin888}
      - TZ=Asia/Shanghai
    volumes:
      # 持久化挂载小说章节、大纲伏线总账、系统配置、番茄免密凭证（容器更新/重建永不丢失配置）
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
